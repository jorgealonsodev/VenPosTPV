[package]
name = "venpos-agent-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-core.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
# The "VenPos Agent" window (`--panel`), the same egui window as on Linux.
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Linux: StatusNotifierItem tray over D-Bus (pure Rust, no tokio) and the
# "VenPos Agent" window (egui on OpenGL; X11/Wayland/EGL/xkbcommon are
# loaded with dlopen at run time, so the binary only links glibc).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
eframe = { version = "0.33.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
# Same winit as eframe; its default features add wayland-dlopen and the
# client-side title bar GNOME on Wayland needs.
winit = "0.30"
