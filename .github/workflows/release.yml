# Release: pushing a tag vX.Y.Z (vX.Y.Z-rc.N for a prerelease) builds the
# three downloadable packages and publishes them as a GitHub Release:
#   VenPosAgent-<agent version>-setup.exe  Windows print agent installer
#   venpostpv-hosting.zip                  TPV app for the web hosting
#   tpvconnect.zip                         PrestaShop module
# Run it by hand (workflow_dispatch) to build the packages as artifacts
# without publishing anything.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    name: Print agent (tests and Windows installer)
    uses: ./.github/workflows/print-agent-windows.yml

  hosting:
    name: Hosting and PrestaShop module packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none
      - name: Build the packages (bin/build-hosting.sh)
        run: PHP_BIN="$(command -v php)" COMPOSER_PHAR="$(command -v composer)" bin/build-hosting.sh
      - name: Check the packages
        run: |
          unzip -l dist/venpostpv-hosting.zip | grep -q ' vendor/autoload.php$'
          unzip -l dist/venpostpv-hosting.zip | grep -q ' install.php$'
          unzip -l dist/tpvconnect.zip | grep -q ' tpvconnect/tpvconnect.php$'
          if unzip -l dist/tpvconnect.zip | grep -q ' tpvconnect/tests/'; then
            echo "tpvconnect.zip must not ship tests" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: venpostpv-hosting
          path: |
            dist/venpostpv-hosting.zip
            dist/tpvconnect.zip
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agent, hosting]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          mkdir -p release
          cp artifacts/venpos-agent-windows/VenPosAgent-*-setup.exe release/
          cp artifacts/venpostpv-hosting/venpostpv-hosting.zip artifacts/venpostpv-hosting/tpvconnect.zip release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
      - name: Write the release notes
        run: |
          agent="$(basename release/VenPosAgent-*-setup.exe | sed 's/^VenPosAgent-\(.*\)-setup\.exe$/\1/')"
          module="$(sed -n "s/.*this->version = '\(.*\)'.*/\1/p" modules/tpvconnect/tpvconnect.php)"
          docs="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs"
          # Template: .github/release-notes.md (@TAG@, @AGENT@, @MODULE@, @DOCS@).
          sed -e "s|@TAG@|${GITHUB_REF_NAME}|g" -e "s|@AGENT@|${agent}|g" \
              -e "s|@MODULE@|${module}|g" -e "s|@DOCS@|${docs}|g" \
              .github/release-notes.md > notes.md
          if grep -q '@[A-Z]*@' notes.md; then echo "unfilled placeholder in notes.md" >&2; exit 1; fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "VenPosTPV $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes --verify-tag "${prerelease[@]}"
