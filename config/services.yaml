# config/services.yaml
parameters:
    app.base_path: '%env(TPV_BASE_PATH)%'
    # Coupon preview is unsafe against an older TPV Connect module, which
    # interprets an unknown operation as order creation. Keep it off until the
    # compatible module is deployed and an operator explicitly enables it.
    env(TPV_COUPON_CHECKOUT_ENABLED): '0'
    # New native coupon creation uses the shop's local calendar day.
    env(PS_SHOP_TIMEZONE): 'Europe/Madrid'
    # Print agent versions (docs/prd/agente-impresion.md U1, U4): empty = none.
    # TPV_AGENT_DOWNLOAD_URL may contain {os}, {arch} and {version}.
    env(TPV_AGENT_MIN_VERSION): ''
    env(TPV_AGENT_LATEST_VERSION): ''
    env(TPV_AGENT_DOWNLOAD_URL): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    VenPosTPV\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    VenPosTPV\Service\Db\ConnectionManagerInterface:
        class: VenPosTPV\Service\Db\ConnectionManager
        arguments:
            $config:
                driver: 'pdo_mysql'
                host: '%tpv.db.host%'
                port: '%tpv.db.port%'
                dbname: '%tpv.db.name%'
                user: '%tpv.db.user%'
                password: '%tpv.db.password%'
                charset: '%tpv.db.charset%'

    doctrine.dbal.tpv_connection:
        class: Doctrine\DBAL\Connection
        factory: ['@VenPosTPV\Service\Db\ConnectionManagerInterface', 'getTpvConnection']

    Doctrine\DBAL\Connection:
        alias: doctrine.dbal.tpv_connection

    VenPosTPV\Service\Sso\SsoTokenVerifier:
        arguments:
            $sharedSecret: '%sso.shared_secret%'
            $connection: '@doctrine.dbal.tpv_connection'

    # PrestaShop API Client
    VenPosTPV\Service\PrestaShop\PrestaShopApiClient:
        arguments:
            $baseUrl: '%ps.api.url%'
            $apiKey: '%ps.api.key%'

    # Deliberately separate from the read/catalog client: cart-rule creation is a native write.
    VenPosTPV\Service\PrestaShop\CouponCreationService:
        arguments:
            $shopUrl: '%env(PS_SHOP_URL)%'
            $apiKey: '%env(PS_API_KEY)%'
            $defaultCurrencyId: '%env(int:PS_DEFAULT_CURRENCY)%'
            $shopTimezone: '%env(PS_SHOP_TIMEZONE)%'

    # Checkout Service
    VenPosTPV\Service\Checkout\PsOrderClient:
        arguments:
            $shopUrl: '%ps.api.url%'
            $sharedSecret: '%sso.shared_secret%'

    VenPosTPV\Service\Checkout\CheckoutService:
        arguments:
            $cart: '@VenPosTPV\Service\Cart\CartService'
            $client: '@VenPosTPV\Service\Checkout\PsOrderClient'
            $conn: '@doctrine.dbal.tpv_connection'
            $cashSessionService: '@VenPosTPV\Service\Cash\CashSessionService'
            $messageBus: '@Symfony\Component\Messenger\MessageBusInterface'
            $printerService: '@VenPosTPV\Service\Print\PrinterService'
            $couponCheckoutEnabled: '%env(bool:TPV_COUPON_CHECKOUT_ENABLED)%'
            $priceResolver: '@VenPosTPV\Service\Catalog\CatalogPriceResolver'

    # Current catalog TTC price, shared by checkout and refunds without ticket
    VenPosTPV\Service\Catalog\CatalogPriceResolver:
        arguments:
            $conn: '@doctrine.dbal.tpv_connection'

    # Ticket Verification Service
    VenPosTPV\Service\Print\TicketVerificationService:
        arguments:
            $secret: '%env(APP_SECRET)%'
            $appUrl: '%env(APP_URL)%'

    # Ticket Data Resolver
    VenPosTPV\Service\Print\TicketDataResolver:
        arguments:
            $storeName: '%env(TPV_STORE_NAME)%'
            $storeAddress: '%env(TPV_STORE_ADDRESS)%'

    # Sync Log Repository
    VenPosTPV\Service\Sync\SyncLogRepository:
        arguments:
            $connection: '@doctrine.dbal.tpv_connection'

    # Stock Push Service (TPV → PS outbound retry)
    VenPosTPV\Service\Sync\StockPushService:
        arguments:
            $connection: '@doctrine.dbal.tpv_connection'
            $psApiClient: '@VenPosTPV\Service\PrestaShop\PrestaShopApiClient'
            $syncLogRepo: '@VenPosTPV\Service\Sync\SyncLogRepository'

    # Sync Status Service
    VenPosTPV\Service\Sync\SyncStatusService:
        arguments:
            $apiClient: '@VenPosTPV\Service\PrestaShop\PrestaShopApiClient'
            $syncLogRepo: '@VenPosTPV\Service\Sync\SyncLogRepository'
            $connection: '@doctrine.dbal.tpv_connection'

    # Catalog Sync Service
    VenPosTPV\Service\Catalog\CatalogSyncService:
        arguments:
            $apiClient: '@VenPosTPV\Service\PrestaShop\PrestaShopApiClient'
            $connection: '@doctrine.dbal.tpv_connection'
            $syncLogRepo: '@VenPosTPV\Service\Sync\SyncLogRepository'
            $psShopUrl: '%ps.api.url%'
            $psApiKey: '%ps.api.key%'

    # Twig
    Twig\Loader\LoaderInterface:
        class: Twig\Loader\FilesystemLoader
        arguments:
            $paths: '%kernel.project_dir%/templates'

    Twig\Environment:
        arguments:
            $loader: '@Twig\Loader\LoaderInterface'
        calls:
            - method: 'addGlobal'
              arguments:
                  - 'base_path'
                  - '%app.base_path%'

    # Controllers with injected base path
    VenPosTPV\Controller\App\SsoController:
        arguments:
            $basePath: '%app.base_path%'
    VenPosTPV\Controller\App\LoginController:
        arguments:
            $basePath: '%app.base_path%'
    VenPosTPV\Controller\App\DevLoginController:
        arguments:
            $basePath: '%app.base_path%'
            $environment: '%kernel.environment%'
    VenPosTPV\Controller\App\PosController:
        arguments:
            $basePath: '%app.base_path%'

    # Refund Service
    VenPosTPV\Service\Refund\PsRefundClient:
        arguments:
            $shopUrl: '%ps.api.url%'
            $sharedSecret: '%sso.shared_secret%'

    VenPosTPV\Service\Refund\PsRestockClient:
        arguments:
            $shopUrl: '%ps.api.url%'
            $sharedSecret: '%sso.shared_secret%'

    # Online orders (not TPV sales) read through the module for refunds/exchanges
    VenPosTPV\Service\Refund\PsOrderLookupClient:
        arguments:
            $shopUrl: '%ps.api.url%'
            $sharedSecret: '%sso.shared_secret%'

    VenPosTPV\Service\Refund\OrderSearchService:
        arguments:
            $connection: '@doctrine.dbal.tpv_connection'
            $lookupClient: '@VenPosTPV\Service\Refund\PsOrderLookupClient'

    VenPosTPV\Service\Refund\RefundService:
        arguments:
            $orderSearchService: '@VenPosTPV\Service\Refund\OrderSearchService'
            $client: '@VenPosTPV\Service\Refund\PsRefundClient'
            $conn: '@doctrine.dbal.tpv_connection'
            $cashSessionService: '@VenPosTPV\Service\Cash\CashSessionService'
            $restockClient: '@VenPosTPV\Service\Refund\PsRestockClient'
            $couponCreationService: '@VenPosTPV\Service\PrestaShop\CouponCreationService'
            $priceResolver: '@VenPosTPV\Service\Catalog\CatalogPriceResolver'

    # Print agent: pairing codes are stored as an HMAC with the app secret (E2, E3)
    VenPosTPV\Service\PrintAgent\AgentRegistry:
        arguments:
            $secret: '%env(APP_SECRET)%'

    VenPosTPV\Service\PrintAgent\AgentReleasePolicy:
        arguments:
            $minVersion: '%env(TPV_AGENT_MIN_VERSION)%'
            $latestVersion: '%env(TPV_AGENT_LATEST_VERSION)%'
            $downloadUrl: '%env(TPV_AGENT_DOWNLOAD_URL)%'

    # Messenger Handler
    VenPosTPV\MessageHandler\SyncCatalogMessageHandler:
        arguments:
            $catalogSyncService: '@VenPosTPV\Service\Catalog\CatalogSyncService'
