; Template rendered by bin/build-php85.sh into the isolated PHP runtime.
; Keep errors out of JSON/CGI responses and log them inside this project.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "@PROJECT_ROOT@/var/log/php85/php-error.log"
expose_php = Off

; Preserve the four observed XAMPP defaults used by this application.
date.timezone = Europe/Berlin
upload_max_filesize = 40M
post_max_size = 40M
memory_limit = 512M
