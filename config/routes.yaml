# config/routes.yaml
health:
    path: /api/health
    controller: VenPosTPV\Controller\Api\HealthController::index
    methods: [GET]

api:
    resource: ../src/Controller/Api/
    type: attribute
    prefix: /api

app:
    resource: ../src/Controller/App/
    type: attribute
    prefix: /app

sso:
    path: /sso
    controller: VenPosTPV\Controller\App\SsoController::index
    methods: [GET]

# The PDF behind a link sent by WhatsApp (DocumentDownloadController): no session,
# outside /api and /app so no session, device or origin listener applies.
document_download:
    path: /d/{token}
    controller: VenPosTPV\Controller\App\DocumentDownloadController::download
    methods: [GET]
    requirements:
        token: '[A-Za-z0-9_-]{1,200}\.[A-Za-z0-9_-]{43}'
